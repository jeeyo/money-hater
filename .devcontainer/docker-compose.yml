services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    environment:
      DATABASE_URL: postgresql://moneyhater:moneyhater@db:5432/moneyhater
      QUEUE_DATABASE_URL: postgresql://moneyhater:moneyhater@db:5432/moneyhater
      MEDIA_ROOT: /workspace/data/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyhater
      POSTGRES_PASSWORD: moneyhater
      POSTGRES_DB: moneyhater
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneyhater']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data

volumes:
  devcontainer-pgdata:
